[package]
name = "circuitgame2-cli"
version = "0.1.0"
edition = "2024"
default-run = "ncg2"
rust-version = "1.99.1"
description = "NCG2 の回路ソースを検査し、組み合わせ関数と順序回路を実行する CLI"
license = "MIT"
repository = "https://github.com/neknaj/circuitgame2-cli"

[[bin]]
name = "ncg2"
path = "src/main.rs"

[[bin]]
name = "circuitgame2-lsp"
path = "src/bin/circuitgame2-lsp/main.rs"

[dependencies]
circuitgame2-core = { version = "0.1.0", git = "https://github.com/neknaj/circuitgame2-core", rev = "fbade5d795de8a82278dd3fafff721bcf652b312" }
circuitgame2-project-config = { version = "0.1.0", git = "https://github.com/neknaj/circuitgame2-core", rev = "fbade5d795de8a82278dd3fafff721bcf652b312" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8.23", default-features = false, features = ["parse"] }

[target.'cfg(any(unix, windows))'.dependencies]
ctrlc = "3.5"

[target.'cfg(not(target_os = "wasi"))'.dependencies]
lsp-server = "0.7.9"
lsp-types = "0.97.0"
tempfile = "3.27"
url = "2.5.9"
