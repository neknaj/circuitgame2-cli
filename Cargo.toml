[package]
name = "circuitgame2-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
description = "NCG2 の回路ソースを検査し、組み合わせ関数と順序回路を実行する CLI"
license = "MIT"
repository = "https://github.com/neknaj/circuitgame2-cli"

[[bin]]
name = "circuitgame2"
path = "src/main.rs"

[dependencies]
circuitgame2-core = { version = "0.1.0", git = "https://github.com/neknaj/circuitgame2-core", rev = "26ed16958f16d3ae46607697ad85d3a340d19391" }
serde = { version = "1", features = ["derive"] }
toml = { version = "0.8.23", default-features = false, features = ["parse"] }
