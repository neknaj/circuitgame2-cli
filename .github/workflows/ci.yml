name: CLI checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run native CLI and LSP tests
        run: cargo test --locked
      - name: Build the WASI CLI
        run: |
          rustup target add wasm32-wasip2
          cargo build --locked --target wasm32-wasip2 --bin ncg2
